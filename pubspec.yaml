name: traveller_demo
description: "Flutter practice project - traveller discovery demo with Riverpod and go_router."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Run `flutter pub add flutter_riverpod go_router` instead of copying these
  # version numbers, so you get the current versions for your Flutter SDK.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true